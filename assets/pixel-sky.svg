<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1200 360"
     width="1200"
     height="360"
     shape-rendering="crispEdges">

  <defs>
    <g id="pixel-flower">
      <rect x="-2" y="0" width="4" height="27" fill="#6BC46B"/>
      <rect x="-10" y="9" width="8" height="4" fill="#75D58A"/>
      <rect x="2" y="15" width="8" height="4" fill="#75D58A"/>
      <rect x="-6" y="-10" width="12" height="8" fill="#FFB3D9"/>
      <rect x="-14" y="-2" width="12" height="8" fill="#FFB3D9"/>
      <rect x="2" y="-2" width="12" height="8" fill="#FFB3D9"/>
      <rect x="-6" y="6" width="12" height="8" fill="#FFB3D9"/>
      <rect x="-6" y="-2" width="12" height="8" fill="#FFF2A8"/>
    </g>

    <g id="sparkle" fill="#FFFFFF">
      <rect x="-2" y="-12" width="4" height="24"/>
      <rect x="-12" y="-2" width="24" height="4"/>
    </g>
  </defs>

  <!-- NIGHT SKY -->
  <rect width="1200" height="360" fill="#0D1117"/>

  <!-- SOFT PIXEL BACKGROUND -->
  <rect x="0" y="295" width="1200" height="3" fill="#23334B"/>
  <rect x="0" y="300" width="1200" height="3" fill="#162338"/>

  <!-- TWINKLING WHITE PIXELS -->
  <g fill="#FFFFFF">
    <rect x="65" y="43" width="4" height="4">
      <animate attributeName="opacity" values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="147" y="106" width="3" height="3">
      <animate attributeName="opacity" values="1;.1;1" dur="2.3s" repeatCount="indefinite"/>
    </rect>
    <rect x="245" y="35" width="4" height="4">
      <animate attributeName="opacity" values=".2;1;.2" dur="1.9s" repeatCount="indefinite"/>
    </rect>
    <rect x="342" y="89" width="3" height="3">
      <animate attributeName="opacity" values="1;.2;1" dur="2.7s" repeatCount="indefinite"/>
    </rect>
    <rect x="468" y="48" width="4" height="4">
      <animate attributeName="opacity" values=".1;1;.1" dur="2.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="586" y="83" width="3" height="3">
      <animate attributeName="opacity" values="1;.1;1" dur="1.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="715" y="37" width="4" height="4">
      <animate attributeName="opacity" values=".2;1;.2" dur="2.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="827" y="95" width="3" height="3">
      <animate attributeName="opacity" values="1;.2;1" dur="1.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="935" y="40" width="4" height="4">
      <animate attributeName="opacity" values=".1;1;.1" dur="2.5s" repeatCount="indefinite"/>
    </rect>
    <rect x="1100" y="127" width="4" height="4">
      <animate attributeName="opacity" values="1;.2;1" dur="1.9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- FLOATING SPARKLES -->
  <g transform="translate(190 70)">
    <use href="#sparkle"/>
    <animate attributeName="opacity" values=".1;1;.1" dur="2s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="190 70;190 62;190 70" dur="3s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(525 45)" fill="#FFFFFF">
    <use href="#sparkle"/>
    <animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(795 70)">
    <use href="#sparkle"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="1.7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate"
      values="795 70;795 62;795 70" dur="3.6s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(1090 245)">
    <use href="#sparkle"/>
    <animate attributeName="opacity" values="1;.1;1" dur="2.2s" repeatCount="indefinite"/>
  </g>

  <!-- PIXEL SUN -->
  <g transform="translate(1040 72)">
    <animateTransform attributeName="transform" type="translate"
      values="1040 72;1040 78;1040 72" dur="4s" repeatCount="indefinite"/>

    <rect x="-5" y="-43" width="10" height="15" fill="#FFD60A"/>
    <rect x="-5" y="30" width="10" height="15" fill="#FFD60A"/>
    <rect x="-43" y="-5" width="15" height="10" fill="#FFD60A"/>
    <rect x="30" y="-5" width="15" height="10" fill="#FFD60A"/>
    <rect x="-27" y="-27" width="54" height="54" fill="#FFB703"/>
    <rect x="-18" y="-18" width="36" height="36" fill="#FFD60A"/>
    <rect x="-12" y="-5" width="5" height="5" fill="#7A4B00"/>
    <rect x="7" y="-5" width="5" height="5" fill="#7A4B00"/>
    <rect x="-6" y="9" width="12" height="4" fill="#7A4B00"/>
  </g>

  <!-- MOVING CLOUDS -->
  <g opacity=".8">
    <animateTransform attributeName="transform" type="translate"
      from="-260 0" to="1400 0" dur="40s" repeatCount="indefinite"/>
    <rect x="20" y="105" width="175" height="24" fill="#E8F2FF"/>
    <rect x="48" y="84" width="70" height="24" fill="#FFFFFF"/>
    <rect x="105" y="93" width="60" height="18" fill="#F1F5F9"/>
  </g>

  <g opacity=".65">
    <animateTransform attributeName="transform" type="translate"
      from="1350 0" to="-300 0" dur="52s" repeatCount="indefinite"/>
    <rect x="0" y="55" width="132" height="20" fill="#E8F2FF"/>
    <rect x="25" y="37" width="55" height="22" fill="#FFFFFF"/>
    <rect x="68" y="45" width="47" height="17" fill="#F1F5F9"/>
  </g>

  <!-- TITLE PANEL -->
  <rect x="170" y="127" width="860" height="132" fill="#151C29" opacity=".88"/>
  <rect x="170" y="127" width="860" height="3" fill="#F7A6C4" opacity=".55"/>
  <rect x="170" y="256" width="860" height="3" fill="#A8E6CF" opacity=".55"/>

  <!-- MAGICAL NAME -->
  <text x="604" y="214"
        text-anchor="middle"
        font-family="'Press Start 2P', monospace"
        font-size="78"
        font-weight="900"
        letter-spacing="3"
        fill="#742647"
        opacity=".8">ZEYNEP ÖZGE</text>

  <text x="600" y="210"
        text-anchor="middle"
        font-family="'Press Start 2P', monospace"
        font-size="78"
        font-weight="900"
        letter-spacing="3"
        fill="#FF9ECF">ZEYNEP ÖZGE
    <animate attributeName="fill"
      values="#FF9ECF;#FFD6ED;#FF9ECF"
      dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- SPARKLES AROUND NAME -->
  <g transform="translate(209 184)">
    <use href="#sparkle"/>
    <animate attributeName="opacity" values=".2;1;.2" dur="1.5s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(995 203)">
    <use href="#sparkle"/>
    <animate attributeName="opacity" values="1;.1;1" dur="2.1s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(365 144)">
    <use href="#sparkle" transform="scale(.5)"/>
    <animate attributeName="opacity" values=".1;1;.1" dur="2.6s" repeatCount="indefinite"/>
  </g>

  <g transform="translate(845 239)">
    <use href="#sparkle" transform="scale(.5)"/>
    <animate attributeName="opacity" values="1;.1;1" dur="1.8s" repeatCount="indefinite"/>
  </g>

  <!-- FLOATING FLOWER PETALS -->
  <g fill="#FFB3D9">
    <rect x="120" y="160" width="7" height="7">
      <animate attributeName="y" values="160;145;160" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".2;.9;.2" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="1070" y="189" width="6" height="6">
      <animate attributeName="y" values="189;171;189" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".9;.2;.9" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="280" y="285" width="5" height="5">
      <animate attributeName="y" values="285;270;285" dur="3.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- PIXEL GARDEN -->
  <rect x="0" y="332" width="1200" height="28" fill="#173A27"/>
  <rect x="0" y="332" width="1200" height="5" fill="#69BA7A"/>

  <!-- FLOWERS -->
  <use href="#pixel-flower" x="95" y="320"/>
  <use href="#pixel-flower" x="235" y="328"/>
  <use href="#pixel-flower" x="410" y="318"/>
  <use href="#pixel-flower" x="785" y="325"/>
  <use href="#pixel-flower" x="960" y="318"/>
  <use href="#pixel-flower" x="1135" y="326"/>

  <!-- GARDEN FIREFLIES -->
  <g fill="#FFF9CF">
    <rect x="160" y="301" width="5" height="5">
      <animate attributeName="opacity" values=".1;1;.1" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="650" y="309" width="5" height="5">
      <animate attributeName="opacity" values="1;.1;1" dur="2s" repeatCount="indefinite"/>
    </rect>
    <rect x="1030" y="292" width="5" height="5">
      <animate attributeName="opacity" values=".1;1;.1" dur="1.7s" repeatCount="indefinite"/>
    </rect>
  </g>

</svg>
